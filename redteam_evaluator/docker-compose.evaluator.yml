services:
  redteam-evaluator:
    build: .
    image: redteam-evaluator:dspy
    network_mode: host
    environment:
      DSPY_API_BASE: "${DSPY_API_BASE:-http://localhost:47821/v1}"
      DSPY_MODEL: "${DSPY_MODEL:-gemma-4-31B-it-NVFP4}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-local}"
      EVALUATOR_BACKEND: "dspy"
    volumes:
      - .:/app:rw
      - ./data:/app/data:rw
    command: ["python", "run_eval.py", "--calibrate", "20", "--workers", "4"]
